<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>如何培养认真严谨的习惯</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            padding: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }
        /* 标题样式 */
        .title {
            text-align: center;
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .title .blue-text {
            color: #0066cc;
        }
        /* 来源和时间样式 */
        .meta-info {
            text-align: center;
            color: #666;
            font-size: 18px;
            margin-bottom: 30px;
        }
        .meta-info .blue-text {
            color: #0066cc;
        }
        /* 主体内容布局 */
        .content-container {
            display: flex;
            align-items: flex-start;
            gap: 30px;
        }
        /* 左侧图片 */
        .content-container img {
            width: 450px;
            height: auto;
        }
        /* 右侧列表 */
        .list-section {
            flex: 1;
        }
        .list-section ul {
            list-style: none;
        }
        .list-section li {
            margin: 20px 0;
            font-size: 18px;
            line-height: 1.6;
        }
        .list-section li::before {
            content: "♠";
            margin-right: 10px;
        }
        .list-section .red-text {
            color: #ff0000;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <!-- 标题 -->
    <h1 class="title">如何培养<span class="blue-text">认真严谨</span>的习惯</h1>
    <!-- 时间和来源 -->
    <div class="meta-info">
        时间:<span class="blue-text">2022年02月21日17时26分</span> &nbsp;&nbsp;来源:思政教育
    </div>
    <!-- 主体内容 -->
    <div class="content-container">
        <!-- 左侧图片 -->
        <img src="attitude.jpg" alt="态度决定一切 细节决定成败">
        <!-- 右侧列表 -->
        <div class="list-section">
            <ul>
                <li>
                    <span class="red-text">反复确认，</span>做任何事情都要照顾到每一个细节并反复确认，
                    <span class="red-text">要有一种能在脑子里‘虚拟’整个事件过程的能力，</span>确保所有的节点都正常。
                </li>
                <li>
                    <span class="red-text">想尽办法努力让不可能变为可能</span>只有佣金全力做了，才算是努力
                </li>
                <li>
                    <span class="red-text">结果导向</span>一切以结果为导向，
                    <span class="red-text">任何事情都是你的名片。</span>还要思考你的结果和过程是否满足所有和你配合的人的需求,
                </li>
                <li>
                    <span class="red-text">学会假设</span>了解周围比你强的人，观察他们的做事方法。遇到让自己束手无策的时候，把自己虚拟成他的样子，想想他会怎么做
                </li>
            </ul>
        </div>
    </div>
</body>
</html>
